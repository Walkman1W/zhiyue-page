<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 之玥的游戏世界</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        .header {
            text-align: center;
            padding: 3rem 1rem 2rem;
            color: white;
        }
        .header h1 { font-size: 2.5rem; margin-bottom: 0.5rem; }
        .header p { font-size: 1.1rem; opacity: 0.9; }
        .games {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
            max-width: 1000px;
            margin: 0 auto;
            padding: 1rem 2rem 3rem;
        }
        .game-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.2s;
            text-decoration: none;
            color: inherit;
        }
        .game-card:hover { transform: translateY(-5px); }
        .game-card .thumb {
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
        }
        .game-card .info {
            padding: 1rem;
        }
        .game-card .info h3 { margin-bottom: 0.3rem; }
        .game-card .info p { font-size: 0.9rem; color: #666; }
        .empty {
            text-align: center;
            color: white;
            padding: 3rem;
            font-size: 1.2rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎮 之玥的游戏世界</h1>
        <p>点击下方游戏卡片开始游玩吧！</p>
    </div>
    <div class="games" id="games">
        <!-- 游戏列表，手动添加 -->
        <a class="game-card" href="./games/demo-game/">
            <div class="thumb">🌟</div>
            <div class="info">
                <h3>示例游戏</h3>
                <p>这是一个示例，替换为你自己的游戏！</p>
            </div>
        </a>
    </div>
</body>
</html>
